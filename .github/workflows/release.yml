name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and prepare release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash evals/test-release-consistency.sh </dev/null
          python3 evals/test-release-preparation.py </dev/null
          python3 scripts/prepare-release.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" </dev/null
          python3 scripts/build-model-compat.py </dev/null
          git diff --exit-code

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: PUA ${{ github.ref_name }}
          body_path: dist/release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: "true"
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/pua-chatgpt.zip
            dist/pua-claude-code.zip
            dist/pua-codex.zip
            dist/manifest.json
